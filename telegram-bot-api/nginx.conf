# telegram-bot-api-proxy — вход для n8n к локальному Telegram Bot API (--local, файлы до 2 ГБ).
# В local-режиме сервер НЕ отдаёт файлы по HTTP: getFile возвращает абсолютный путь на диске.
# Telegram-нода n8n качает файл по {baseUrl}/file/bot<token>/<file_path> — этот прокси отдаёт его с диска,
# поэтому существующие ноды «Download file» работают без правок. Всё остальное — прокси к telegram-bot-api:8081.
# Кред Telegram в n8n: Base URL = http://telegram-bot-api-proxy
server {
    listen 80;
    server_name _;
    client_max_body_size 2000m;

    # файл отдаётся, только если токен в URL совпадает с папкой бота
    location ~ ^/file/bot([^/]+)/+var/lib/telegram-bot-api/\1/(.+)$ {
        alias /var/lib/telegram-bot-api/$1/$2;
        default_type application/octet-stream;
    }
    location /file/ { return 404; }

    location / {
        proxy_pass http://telegram-bot-api:8081;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}

services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile.n8n
      args:
        DOCKER_GID: ${DOCKER_GID:-999}
    container_name: n8n-app
    restart: always
    user: "0:0"
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}

      - N8N_BASE_URL=https://${DOMAIN}
      - N8N_EXPRESS_TRUST_PROXY=true
      - N8N_TRUSTED_PROXIES=*
      - N8N_PROXY_HOPS=${N8N_PROXY_HOPS}

      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin

      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}

      - WEBHOOK_URL=https://${DOMAIN}/

      - GENERIC_TIMEZONE=Asia/Yekaterinburg
      - NODE_ENV=production
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - NODE_OPTIONS=--max-old-space-size=4096
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      
      - EXECUTIONS_PROCESS=${EXECUTIONS_PROCESS:-queue}
      - N8N_CONCURRENCY=${N8N_CONCURRENCY:-10}
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=48
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none

      - N8N_RUNNERS_TASK_TIMEOUT=1800

      - EXECUTIONS_TIMEOUT=-1
      - EXECUTIONS_TIMEOUT_MAX=14400

      - N8N_PAYLOAD_SIZE_MAX=512
      - N8N_FORMDATA_FILE_SIZE_MAX=2048

      - HTTP_PROXY=${PROXY_URL}
      - HTTPS_PROXY=${PROXY_URL}
      - NO_PROXY=${NO_PROXY}
      - NODES_EXCLUDE=[]
      - N8N_RESTRICT_FILE_ACCESS_TO=/data
      - PATH=/opt/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      - N8N_USER_FOLDER=/home/node
      
      # BINARY DATA MODE
      - N8N_BINARY_DATA_MODE=${N8N_BINARY_DATA_MODE:-filesystem}
      - N8N_DEFAULT_BINARY_DATA_MODE=${N8N_DEFAULT_BINARY_DATA_MODE:-filesystem}

      
      # QUEUE MODE
      - QUEUE_BULL_REDIS_HOST=${QUEUE_BULL_REDIS_HOST}
      - QUEUE_BULL_REDIS_PORT=${QUEUE_BULL_REDIS_PORT}
      - EXECUTIONS_RECOVERY_ENABLED=${EXECUTIONS_RECOVERY_ENABLED}

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - n8n_data:/home/node/.n8n
      - /opt/n8n-install/data:/data
      - ./backup_n8n.sh:/opt/n8n-install/backup_n8n.sh
      - ./update_n8n.sh:/opt/n8n-install/updaten8n.sh
      - ./backups:/opt/n8n-install/backups
      - ./.env:/opt/n8n-install/.env
      - /opt/rsshub:/opt/rsshub
      - ./shims/python:/usr/bin/python:ro
      - ./shims/python3:/usr/bin/python3:ro
      - ./shims/ffmpeg:/usr/bin/ffmpeg:ro
      - ./shims/yt-dlp:/usr/bin/yt-dlp:ro
      - ./shims:/opt/shims:ro
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "999"
    depends_on:
      - n8n-postgres
      - n8n-redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=myresolver"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

  n8n-worker:
    build:
      context: .
      dockerfile: Dockerfile.n8n
      args:
        DOCKER_GID: ${DOCKER_GID:-999}
    container_name: n8n-worker
    restart: always
    user: "0:0"
    command: worker
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=Asia/Yekaterinburg
      - NODE_ENV=production
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - NODE_OPTIONS=--max-old-space-size=4096
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      
      - EXECUTIONS_PROCESS=${EXECUTIONS_PROCESS:-queue}
      - N8N_CONCURRENCY=${N8N_CONCURRENCY:-10}
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=48
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - N8N_PAYLOAD_SIZE_MAX=512
      - N8N_FORMDATA_FILE_SIZE_MAX=2048
      
      - N8N_RUNNERS_TASK_TIMEOUT=1800
      - EXECUTIONS_TIMEOUT=-1
      - EXECUTIONS_TIMEOUT_MAX=14400
      - NODES_EXCLUDE=[]
      - N8N_RESTRICT_FILE_ACCESS_TO=/data

      - HTTP_PROXY=${PROXY_URL}
      - HTTPS_PROXY=${PROXY_URL}
      - NO_PROXY=${NO_PROXY}
      - PATH=/opt/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      - N8N_USER_FOLDER=/home/node
      
      # BINARY DATA MODE
      - N8N_BINARY_DATA_MODE=${N8N_BINARY_DATA_MODE:-filesystem}
      - N8N_DEFAULT_BINARY_DATA_MODE=${N8N_DEFAULT_BINARY_DATA_MODE:-filesystem}
      
      # QUEUE MODE
      - QUEUE_BULL_REDIS_HOST=${QUEUE_BULL_REDIS_HOST}
      - QUEUE_BULL_REDIS_PORT=${QUEUE_BULL_REDIS_PORT}
      - EXECUTIONS_RECOVERY_ENABLED=${EXECUTIONS_RECOVERY_ENABLED}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - n8n_data:/home/node/.n8n
      - /opt/n8n-install/data:/data
      - ./.env:/opt/n8n-install/.env
      - /opt/rsshub:/opt/rsshub
      - ./shims/python:/usr/bin/python:ro
      - ./shims/python3:/usr/bin/python3:ro
      - ./shims/ffmpeg:/usr/bin/ffmpeg:ro
      - ./shims/yt-dlp:/usr/bin/yt-dlp:ro
      - ./shims:/opt/shims:ro
    group_add:
      - "999"
    depends_on:
      - n8n-postgres
      - n8n-redis

  n8n-postgres:
    image: postgres:15-alpine
    container_name: n8n-postgres
    restart: always
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=1024MB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "effective_cache_size=3GB"
      - "-c"
      - "maintenance_work_mem=256MB"
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n-redis:
    image: redis:7-alpine
    container_name: n8n-redis
    restart: always
    volumes:
      - redis_data:/data

  n8n-traefik:
    image: traefik:2.10.4
    container_name: n8n-traefik
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=n8n-install_default"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesResolvers.myresolver.acme.httpChallenge.entryPoint=web"
      - "--certificatesResolvers.myresolver.acme.email=${EMAIL}"
      - "--certificatesResolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
      - ./traefik_dynamic:/etc/traefik/dynamic
      - /opt/rsshub:/opt/rsshub:ro

  n8n-tools:
    build:
      context: .
      dockerfile: Dockerfile.tools
    container_name: n8n-tools
    restart: always
    command: ["sh", "-lc", "sleep infinity"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/n8n-install/data:/data
    environment:
      - HTTP_PROXY=${PROXY_URL}
      - HTTPS_PROXY=${PROXY_URL}
      - NO_PROXY=${NO_PROXY}


  n8n-bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: n8n-bot
    restart: always
    environment:
      - TG_BOT_TOKEN=${TG_BOT_TOKEN}
      - TG_USER_ID=${TG_USER_ID}
      # Бот запускает update_n8n.sh внутри своего контейнера: ему нужны override, Dockerfile.n8n и шимы.
      - COMPOSE_FILE=/opt/n8n-install/docker-compose.yml:/opt/n8n-install/docker-compose.override.yml
      - COMPOSE_PROJECT_NAME=n8n-install
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Вся папка установки целиком (а не отдельные файлы): sed -i/cp пересоздают inode,
      # и по-файловые bind-mount'ы (.env, скрипты) «залипали» на старой версии.
      - ./:/opt/n8n-install
      - /usr/libexec/docker/cli-plugins/docker-compose:/usr/libexec/docker/cli-plugins/docker-compose:ro
      - /opt/n8n-install/docker-plugins:/root/.docker/cli-plugins:ro
      - /usr/libexec/docker/cli-plugins/docker-compose:/root/.docker/cli-plugins/docker-compose:ro
    labels:
      - "traefik.enable=false"

volumes:
  n8n_data:
  postgres_data:
  redis_data:
  traefik_letsencrypt:
